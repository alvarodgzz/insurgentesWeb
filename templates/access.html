<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <base href="{{BASE}}">
  <title>Los Insurgentes — Próximamente</title>
  <meta name="description" content="El nuevo sitio de Los Insurgentes. Próximamente.">
  {{TELEMETRY}}
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="css/access.css">
  <script src="js/access.js" defer></script>
</head>
<body>
  <div class="access-shell">
    <header class="access-header">
      <span>Rock desde Monterrey, N. L.</span>
      <span class="access-header-mark" aria-hidden="true">LI / MX</span>
    </header>

    <main class="access-main">
      <section class="access-copy" aria-labelledby="access-title">
        <img class="access-logo" src="assets/logos/logo-full-white.png" width="1600" height="561" alt="Los Insurgentes">
        <p class="access-eyebrow"><span aria-hidden="true"></span> El nuevo sitio está en camino</p>
        <h1 id="access-title">Próximamente.</h1>
        <p class="access-intro">Estamos preparando nuestra próxima etapa.<br>Nos vemos de este lado del ruido.</p>

        <form class="access-form" id="access-form" method="post" aria-labelledby="access-form-title">
          <h2 id="access-form-title">Acceso de la banda</h2>
          <label for="access-password">Contraseña</label>
          <div class="access-password-wrap">
            <input id="access-password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required disabled aria-describedby="access-status">
            <button class="access-reveal" id="access-reveal" type="button" aria-controls="access-password" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <button class="access-submit" id="access-submit" type="submit" disabled><span id="access-submit-label">Entrar al sitio</span><span aria-hidden="true">↗</span></button>
          <p class="access-status" id="access-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
        <noscript><p class="access-noscript">El sitio completo estará disponible pronto. Para abrir el acceso de la banda, activa JavaScript en tu navegador.</p></noscript>
      </section>

      <div class="access-art" aria-hidden="true">
        <span class="access-orbit access-orbit-one"></span>
        <span class="access-orbit access-orbit-two"></span>
        <img class="access-skull" src="assets/logos/skull-icon-orange.png" width="1600" height="1400" alt="">
        <span class="access-art-caption">Larga vida al ruido.</span>
      </div>
    </main>

    <footer class="access-footer"><span>Los Insurgentes</span><span>Vista previa · Acceso privado</span></footer>
  </div>
</body>
</html>
