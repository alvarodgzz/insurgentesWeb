<link rel="apple-touch-icon" href="images/favicon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/spotify.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>
<header class="site-header">
  <nav class="nav" aria-label="Navegación principal">
    <a href="#top" class="nav-brand"><img src="assets/logos/logo-full-white.png" alt="Los Insurgentes — inicio" width="1600" height="561"></a>
    <button type="button" class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#sencillos">Sencillos</a></li><li><a href="#music">Música</a></li><li><a href="#about">Nosotros</a></li><li><a href="#gallery">Galería</a></li><li><a href="#lyrics">Letras</a></li><li><a href="#shows">Shows</a></li><li><a href="#contact">Contacto</a></li>

{{SINGLES}}
{{ABOUT}}

{{FOOTER}}
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visor de fotos de la galería" aria-hidden="true">
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Cerrar visor de fotos">&times;</button>
  <button type="button" class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Foto anterior">&#10094;</button>
  <button type="button" class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Foto siguiente">&#10095;</button>
  <div class="lightbox-content"><div class="lightbox-stage"><img class="lightbox-img" id="lightboxImg" alt=""></div><p class="lightbox-caption" id="lightboxCaption"></p><span class="lightbox-counter" id="lightboxCounter" aria-live="polite" aria-atomic="true"></span><div class="lightbox-filmstrip" id="lightboxFilmstrip"></div></div>
</div>
<script src="js/main.js" defer></script>
<script src="js/spotify.js" defer></script>
</body>
</html>
